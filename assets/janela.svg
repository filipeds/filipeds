<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 238" width="880" height="238" role="img" aria-label="Uma janela chamada Desenvolvedor__c, com dois paineis lado a lado, sobre a mesma nevoa do banner. A esquerda, painel Registro: os campos se preenchem um a um — Atuacao__c igual a Desenvolvedor Salesforce; Formacao__c igual a Engenharia de Software; Stack_Principal__c igual a Apex, LWC, Aura, SOQL e Flow; Ferramentas__c igual a SFDX, Salesforce CLI e Jest; Stack_Secundaria__c igual a Node, TypeScript, Java e Python; Dados__c igual a SQL, MySQL, PostgreSQL e Prisma — terminando na mensagem Registro salvo. A direita, painel Terminal: o comando sf project deploy start sobe duas classes Apex, uma trigger e dois Lightning Web Components, terminando em Deploy Succeeded, cinco de cinco.">
